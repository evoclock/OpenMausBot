name: PR review gate
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: pr-review-gate-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true
jobs:
  pr-review-gate:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Review freeze, comment tags and journey claims
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PR_GATE_MAINTAINERS: ${{ vars.PR_GATE_MAINTAINERS }}
        run: |
          GATE=.github/tools/pr_review_gate.js
          if [ ! -f "$GATE" ]; then
            echo '::notice::PR review gate tool is absent on the base branch (bootstrap PR).'
            exit 0
          fi
          node "$GATE" --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"
