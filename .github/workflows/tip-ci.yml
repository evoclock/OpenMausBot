# Tip CI formerly on Buildkite openmausbot-ci (mac-mini). Same tip gates on GitHub Actions for take-home speed.
# Mac-only e2e (recovery / helper-model / steer) stays out of tip shards; reintroduce on a Mac lane later if needed.
name: Tip CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: git fetch --quiet origin main
      - run: node scripts/check-ci-contract.mjs origin/main HEAD
      - run: bash .buildkite/public-scan.sh
      - run: node --test .github/tools/*.test.mjs electron/shared-computer-access.node-test.mjs
      - run: python -m unittest discover -s .github/tools/pr-wording/tests -p 'test_*.py'

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest shard ${{ matrix.shard }}/4
        run: >
          pnpm exec vitest run
          --shard=${{ matrix.shard }}/4
          --exclude '**/*recovery.e2e.test.ts'
          --exclude '**/helper-model.e2e.test.ts'
          --exclude '**/steer-e2e.test.ts'

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openmausbot/docs types:check
      - run: pnpm --filter @openmausbot/docs lint
      - run: pnpm docs:build

  tip:
    name: typecheck / lint / tests
    needs: [typecheck, lint, test, docs]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require tip gates green
        run: |
          set -euo pipefail
          test "${{ needs.typecheck.result }}" = success
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.docs.result }}" = success
