name: Author check
on:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  author-check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      ALLOWED_COMMIT_EMAILS: ${{ vars.ALLOWED_COMMIT_EMAILS }}
    steps:
      - name: Check every PR commit author and committer
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$ALLOWED_COMMIT_EMAILS" ]]; then
            echo '::notice::ALLOWED_COMMIT_EMAILS is unset; author check is informational.'
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
            --jq '.[] | [.sha, .commit.author.email, .commit.committer.email] | @json' |
            node --input-type=module -e '
              let input = "";
              for await (const chunk of process.stdin) input += chunk;
              const allowed = new Set(process.env.ALLOWED_COMMIT_EMAILS.split(",").map(x => x.trim().toLowerCase()).filter(Boolean));
              if (!allowed.size) throw new Error("ALLOWED_COMMIT_EMAILS contains no addresses");
              const rows = input.trim().split("\n").filter(Boolean).map(line => JSON.parse(line));
              if (!rows.length) throw new Error("No PR commits returned");
              let failed = false;
              for (const [sha, author, committer] of rows) {
                if (!allowed.has(String(author ?? "").toLowerCase()) || !allowed.has(String(committer ?? "").toLowerCase())) {
                  console.error(`::error::Commit ${sha} has an author or committer email outside ALLOWED_COMMIT_EMAILS`);
                  failed = true;
                }
              }
              if (failed) process.exitCode = 1;
            '
