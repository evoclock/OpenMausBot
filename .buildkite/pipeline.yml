# Host-only checks. Release publishing remains in GitHub Actions.
# Mac-1 needs sfw, Node >=24, pnpm 10.33.0, uv-managed Python 3.12, git and gh on PATH.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  # Mac-1 already has the pinned pnpm under the Pi harness bin directory.
  PATH: "${HOME}/.pi/pi/harness/bin:${PATH}"
steps:
  - label: "Typecheck"
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 20
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm typecheck"
  - label: "Lint and policy tests"
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 20
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm lint"
      - ".buildkite/public-scan.sh"
      - "node --test .github/tools/*.test.mjs electron/shared-computer-access.node-test.mjs"
      - "uv run --no-project --managed-python --no-python-downloads --python 3.12 python -m unittest discover -s .github/tools/pr-wording/tests -p 'test_*.py'"
  - label: "Tests 1/4"
    if: build.pull_request.id == null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm exec vitest run --shard=1/4 --exclude '**/*recovery.e2e.test.ts' --exclude '**/helper-model.e2e.test.ts' --exclude '**/steer-e2e.test.ts'"
  - label: "Tests 2/4"
    if: build.pull_request.id == null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm exec vitest run --shard=2/4 --exclude '**/*recovery.e2e.test.ts' --exclude '**/helper-model.e2e.test.ts' --exclude '**/steer-e2e.test.ts'"
  - label: "Tests 3/4"
    if: build.pull_request.id == null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm exec vitest run --shard=3/4 --exclude '**/*recovery.e2e.test.ts' --exclude '**/helper-model.e2e.test.ts' --exclude '**/steer-e2e.test.ts'"
  - label: "Tests 4/4"
    if: build.pull_request.id == null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm exec vitest run --shard=4/4 --exclude '**/*recovery.e2e.test.ts' --exclude '**/helper-model.e2e.test.ts' --exclude '**/steer-e2e.test.ts'"
  - label: "PR Mac tests 1/8"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    env: { SHARD_INDEX: "0" }
    # Buildkite agent v3.32.2 uploads artifact_paths after commands that fail.
    artifact_paths: &mac-pr-reports
      - ".omb-scratch/buildkite-reports/vitest-*.json"
      - ".omb-scratch/buildkite-reports/junit-*.xml"
    command: &mac-pr-tests
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - |
        mkdir -p .omb-scratch/buildkite-reports
        report=".omb-scratch/buildkite-reports/vitest-$$SHARD_INDEX.json"
        status=0
        pnpm exec vitest run --shard=$$((SHARD_INDEX+1))/8 --exclude '**/*recovery.e2e.test.ts' --exclude '**/helper-model.e2e.test.ts' --exclude '**/steer-e2e.test.ts' --reporter=default --reporter=json --outputFile.json="$$report" --reporter=junit --outputFile.junit=".omb-scratch/buildkite-reports/junit-$$SHARD_INDEX.xml" || status=$$?
        if test -s "$$report"; then
          kept="$$HOME/.cache/omb-buildkite-reports/$$BUILDKITE_PIPELINE_SLUG/$$BUILDKITE_BUILD_NUMBER"
          mkdir -p "$$kept" && cp "$$report" "$$kept/vitest-$$SHARD_INDEX.json" || true
          node scripts/testing/update-shard-weights.mjs --durations-json "$$report" > ".omb-scratch/buildkite-reports/durations-$$SHARD_INDEX.json"
          buildkite-agent artifact upload ".omb-scratch/buildkite-reports/durations-$$SHARD_INDEX.json"
        fi
        exit "$$status"
  - label: "PR Mac tests 2/8"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    env: { SHARD_INDEX: "1" }
    artifact_paths: *mac-pr-reports
    command: *mac-pr-tests
  - label: "PR Mac tests 3/8"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    env: { SHARD_INDEX: "2" }
    artifact_paths: *mac-pr-reports
    command: *mac-pr-tests
  - label: "PR Mac tests 4/8"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    env: { SHARD_INDEX: "3" }
    artifact_paths: *mac-pr-reports
    command: *mac-pr-tests
  - label: "PR Mac tests 5/8"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    env: { SHARD_INDEX: "4" }
    artifact_paths: *mac-pr-reports
    command: *mac-pr-tests
  - label: "PR Mac tests 6/8"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    env: { SHARD_INDEX: "5" }
    artifact_paths: *mac-pr-reports
    command: *mac-pr-tests
  - label: "PR Mac tests 7/8"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    env: { SHARD_INDEX: "6" }
    artifact_paths: *mac-pr-reports
    command: *mac-pr-tests
  - label: "PR Mac tests 8/8"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 30
    env: { SHARD_INDEX: "7" }
    artifact_paths: *mac-pr-reports
    command: *mac-pr-tests
  - label: "Recovery e2e"
    priority: -1
    agents: { queue: mac-mini }
    concurrency: 1
    concurrency_group: openmausbot-recovery-e2e-mac-mini
    timeout_in_minutes: 30
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm exec vitest run server/*recovery.e2e.test.ts"
  - label: "Helper model e2e"
    priority: -1
    agents: { queue: mac-mini }
    concurrency: 1
    concurrency_group: openmausbot-helper-model-e2e-mac-mini
    timeout_in_minutes: 30
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm exec vitest run server/helper-model.e2e.test.ts"
  - label: "Docs"
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 15
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm --filter @openmausbot/docs types:check"
      - "pnpm --filter @openmausbot/docs lint"
      - "pnpm docs:build"
  - label: "Dependencies"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 15
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - ".buildkite/pr-checks.sh dependencies"
  - wait:
      continue_on_failure: true
  - label: "Steering e2e"
    priority: -1
    agents: { queue: mac-mini }
    concurrency: 1
    concurrency_group: openmausbot-steer-e2e-mac-mini
    timeout_in_minutes: 30
    command:
      - ".buildkite/host.sh"
      - "sfw pnpm install --frozen-lockfile"
      - "pnpm exec vitest run server/steer-e2e.test.ts"
  - label: "Slowest 20 tests"
    if: build.pull_request.id != null
    priority: -1
    agents: { queue: mac-mini }
    timeout_in_minutes: 5
    command:
      - ".buildkite/host.sh"
      - "mkdir -p .omb-scratch/shard-durations"
      - 'buildkite-agent artifact download ".omb-scratch/buildkite-reports/durations-*.json" .omb-scratch/shard-durations'
      - 'node scripts/testing/update-shard-weights.mjs --slowest .omb-scratch/shard-durations/.omb-scratch/buildkite-reports/durations-*.json | buildkite-agent annotate --context vitest-slowest-20 --style info'
